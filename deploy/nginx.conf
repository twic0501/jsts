# Include this file from the nginx http{} context (for example conf.d/paper-magic.conf).
# Replace research.example.com and certificate paths before public deployment.
limit_req_zone $binary_remote_addr zone=paper_magic_api:10m rate=15r/m;

server {
    listen 443 ssl;
    server_name research.example.com;
    ssl_certificate /etc/letsencrypt/live/research.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaperMagicTLS:10m;
    ssl_session_tickets off;

    # Protect expensive inference in a hosted demonstration.
    auth_basic "Paper Magic demonstration";
    auth_basic_user_file /etc/nginx/paper-magic.htpasswd;
    client_max_body_size 8k;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_types application/json application/javascript text/css application/wasm;

    location /api/ {
        limit_req zone=paper_magic_api burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
